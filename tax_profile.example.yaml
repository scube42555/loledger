# Optional settings for `loledger tax` and the web app (copy to tax_profile.yaml, which is git-ignored).
name: "Your Name"            # printed on the IRS forms; add ssn: only if you want it printed
filing_status: single         # or married_joint / married_separate ($1,500 loss limit); starred in the tax estimate
state: SC                     # state of residence for the tax page's estimate (only SC so far); omit for federal only
brokers_1099da: [Gemini, Coinbase, Crypto.com, Binance.US]   # sales there use Form 8949 box H/K from 2025
proceeds: records             # or 1099da: Form 8949 uses the proceeds an imported 1099-DA reports for its sales
capital_loss_carryover:       # amounts carried INTO a year, from your filed returns (overrides the estimate)
  2025: {short_term: 0, long_term: 0}
closed_accounts:              # exchange accounts you no longer have (date closed): no Re-sync; history still used
  # What was still held there is written off that day with no deduction claimed; add treatment: capital_loss to
  # report it as disposed of for $0 instead (confirm with your tax preparer).
  # SomeExchange: "2025-08-01"
  # OtherExchange: {date: "2025-08-01", treatment: capital_loss}
# Gifts whose history you know: the donor's basis replaces the value on arrival (otherwise FMV is used and
# flagged). Inherited by the donor: basis = FMV on the date of death, always long-term ("INHERITED" on Form 8949).
# A regular gift: `acquired: <donor's date>` instead of `inherited`. If the gift was worth less than that basis
# when you received it, a loss uses the lower value and a sale in between gives no gain or loss (IRC 1015).
gifts_received:
  - txs: ["<tx hash of the gift receipt>"]
    inherited: 2024-03-15
    basis_per_unit: 65000
